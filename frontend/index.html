<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Explore Vieques — Map & Guide</title>

    <!-- PWA / installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b2231" />
    <meta name="description" content="Discover beaches, restaurants, activities, and transportation on Vieques, Puerto Rico — with an AI travel assistant." />

    <!-- iOS standalone ("Add to Home Screen"). black-translucent + the
         viewport-fit=cover above let the map fill behind the status bar; the
         in-app safe-area padding keeps UI clear of the notch. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Explore Vieques" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
